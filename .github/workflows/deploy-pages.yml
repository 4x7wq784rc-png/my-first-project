name: Deploy to GitHub Pages

# 将来 GitHub Pages で公開したくなったとき用のワークフローです。
# 現在は「手動実行のみ」（Actions タブ →このワークフロー→「Run workflow」）。
# 公開を本格運用するなら、push トリガーのコメントを外してください。
#
# ※ 利用には事前に Settings → Pages → Source を「GitHub Actions」にする必要があります。
#   非公開リポジトリの場合は GitHub Pro 等の対応プランが必要です。
on:
  workflow_dispatch:
  # push:
  #   branches:
  #     - main

# Pages へのデプロイに必要な権限
permissions:
  contents: read
  pages: write
  id-token: write

# 同時に1つだけデプロイ（古い実行はキャンセル）
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site (repository root)
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
